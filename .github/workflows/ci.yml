# テストを PR ごとに行い、main とタグ v* ではイメージを ghcr.io に置く。
#   main への push   → ghcr.io/ueemon/ai-paper-modelar:main と :main-<コミット>
#   タグ v1.2.3 の push → :1.2.3 と :stable（Oracle Cloud の papercraft-1 が使う）
name: CI
on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app
      - name: Unit tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Encrypted AI vault tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: AI settings browser tests
        run: npm run test:browser
        env:
          PYTHON: python
      - name: AI settings JavaScript syntax check
        run: |
          node --check app/static/ai-vault.js
          node --check app/static/ai-settings.js
      - name: JavaScript syntax check
        run: node --check app/static/app.js
      - name: Project library JavaScript syntax check
        run: node --check app/static/projects.js
      - name: Mesh frontend JavaScript syntax check
        run: node --check app/static/mesh.js

  image:
    needs: test
    # VM は Oracle Cloud の A1（aarch64）なので arm64 で作る
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ueemon/ai-paper-modelar
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ai-paper-modelar:scan
      # 修正版のある CRITICAL があれば止める（コミットで固定。v0.35.0）
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ai-paper-modelar:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
