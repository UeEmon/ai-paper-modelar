services:
  paper-modelar:
    build: .
    ports:
      - "127.0.0.1:8086:8086"
    env_file:
      - path: .env
        required: false
    environment:
      PAPER_MODELAR_DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - paper_modelar_data:/data
    restart: unless-stopped
volumes:
  paper_modelar_data:
